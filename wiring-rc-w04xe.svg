<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="PingFang TC, Noto Sans TC, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">RC-W04XE / RC-W05XE 刷機接線示意圖（不按比例）</text>

  <!-- board front -->
  <rect x="60" y="70" width="380" height="520" rx="14" fill="#1f7a4d" stroke="#14532d" stroke-width="3"/>
  <text x="250" y="100" font-size="17" text-anchor="middle" fill="#fff">模組正面</text>
  <!-- J13 connector -->
  <rect x="90" y="115" width="110" height="40" rx="4" fill="#f3f3f3" stroke="#999"/>
  <text x="145" y="141" font-size="15" text-anchor="middle" fill="#333">J13 接頭</text>
  <!-- chip -->
  <rect x="180" y="370" width="110" height="110" rx="6" fill="#222"/>
  <text x="235" y="430" font-size="14" text-anchor="middle" fill="#ddd">主晶片</text>

  <!-- J14: round, round, square -->
  <text x="78" y="245" font-size="16" font-weight="bold" fill="#fff">J14</text>
  <circle cx="160" cy="270" r="11" fill="#d4a017" stroke="#7a5c00" stroke-width="2"/>
  <circle cx="160" cy="305" r="11" fill="#d4a017" stroke="#7a5c00" stroke-width="2"/>
  <rect x="149" y="329" width="22" height="22" fill="#d4a017" stroke="#7a5c00" stroke-width="2"/>
  <text x="78" y="275" font-size="13" fill="#fff">① 圓孔</text>
  <text x="78" y="310" font-size="13" fill="#fff">② 圓孔</text>
  <text x="78" y="345" font-size="13" fill="#fff">③ 方孔</text>

  <!-- J15 pair with resistor -->
  <text x="240" y="510" font-size="15" font-weight="bold" fill="#fff">J15（旁邊有 R14）</text>
  <rect x="339" y="519" width="22" height="22" fill="#d4a017" stroke="#7a5c00" stroke-width="2"/>
  <circle cx="400" cy="530" r="11" fill="#d4a017" stroke="#7a5c00" stroke-width="2"/>
  <path d="M350 541 L350 565 L366 565 l4 -8 l8 16 l8 -16 l8 16 l4 -8 L400 565 L400 541" fill="none" stroke="#ffeb3b" stroke-width="3"/>
  <text x="375" y="590" font-size="14" text-anchor="middle" fill="#ffeb3b">330Ω</text>

  <!-- USB to TTL 1 (signal) box -->
  <rect x="500" y="215" width="200" height="160" rx="10" fill="#1e3a8a"/>
  <text x="600" y="245" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">USB to TTL ①（訊號）</text>
  <text x="600" y="268" font-size="13" text-anchor="middle" fill="#cbd5ff">跳帽設 3.3V，VCC 不接</text>
  <text x="690" y="300" font-size="15" text-anchor="end" fill="#fff">GND</text>
  <text x="690" y="330" font-size="15" text-anchor="end" fill="#fff">RXD</text>
  <text x="690" y="360" font-size="15" text-anchor="end" fill="#fff">TXD</text>
  <line x1="171" y1="270" x2="510" y2="295" stroke="#111" stroke-width="3"/>
  <line x1="171" y1="305" x2="510" y2="325" stroke="#e11d48" stroke-width="3"/>
  <line x1="171" y1="340" x2="510" y2="355" stroke="#f8fafc" stroke-width="5"/>
  <line x1="171" y1="340" x2="510" y2="355" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- USB to TTL 2 (power) box -->
  <rect x="500" y="420" width="200" height="120" rx="10" fill="#7c2d12"/>
  <text x="600" y="450" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">USB to TTL ②（供電）</text>
  <text x="600" y="473" font-size="13" text-anchor="middle" fill="#fed7aa">切 5V，只負責供電</text>
  <text x="600" y="500" font-size="15" text-anchor="middle" fill="#fff">5V → 背面 VBUS</text>
  <text x="600" y="525" font-size="15" text-anchor="middle" fill="#fff">GND → 背面 GND</text>

  <!-- notes -->
  <text x="730" y="100" font-size="16" font-weight="bold" fill="#222">順序</text>
  <text x="730" y="128" font-size="14" fill="#333">1. 先接好所有線</text>
  <text x="730" y="152" font-size="14" fill="#333">　和 330Ω</text>
  <text x="730" y="176" font-size="14" fill="#333">2. 插 USB to TTL ①</text>
  <text x="730" y="200" font-size="14" fill="#333">3. 最後插 USB to TTL ②</text>
  <text x="730" y="224" font-size="14" fill="#333">　（模組才通電）</text>
  <text x="730" y="262" font-size="14" fill="#b91c1c">刷完一定要</text>
  <text x="730" y="286" font-size="14" fill="#b91c1c">拿掉 330Ω</text>
  <text x="730" y="310" font-size="14" fill="#b91c1c">才會正常開機</text>

  <text x="450" y="625" font-size="13" text-anchor="middle" fill="#555">J15 的方孔是 3.3V、圓孔接晶片的下載腳；J14 ① 接 GND、② 接 ① 號的 RXD、③ 接 ① 號的 TXD</text>
</svg>
